  <text x="76" y="166" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="54" font-weight="750" letter-spacing="-1.5">Paper Search</text>
  <text x="79" y="211" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="450">Find the work. Follow the evidence.</text>
